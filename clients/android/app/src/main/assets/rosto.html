<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Rosto do BMO</title>
    <style>
        body {
          margin: 0;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: transparent;
          font-family: sans-serif;
          overflow: hidden;
        }

        .screen {
          width: 100vw;
          height: 100vh;
          background: #aff5bf; /* Magic Mint - BMO Style */
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          transition: all 0.5s ease;
        }

        .eyes {
          display: flex;
          gap: 60px;
          margin-bottom: 20px;
        }

        .eye {
          width: 32px;
          height: 32px;
          background: #0a1d20;
          border-radius: 50%;
          animation: blink 4.5s infinite;
          transform-origin: center;
          transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes blink {
          0%, 92%, 100% { transform: scaleY(1); }
          95% { transform: scaleY(0.1); }
        }

        .mouth {
          width: 80px;
          height: 40px;
          border-bottom: 8px solid #0a1d20;
          border-radius: 0 0 40px 40px;
          transition: all 0.4s ease;
        }

        /* SLEEPING State */
        body.sleeping .screen {
            background: #8ec3a7;
            filter: grayscale(0.3) brightness(0.8);
        }
        body.sleeping .eye {
            height: 4px;
            width: 36px;
            border-radius: 2px;
            animation: breathe 3s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        body.sleeping .mouth {
            width: 30px;
            height: 15px;
            border-bottom: 4px solid #0a1d20;
            opacity: 0.6;
            border-radius: 0;
        }

        /* IDLE State (Default) */
        body.idle .mouth {
            animation: idleTalk 10s infinite ease-in-out;
        }
        @keyframes idleTalk {
            0%, 100%, 40%, 60% { height: 40px; transform: scaleX(1); }
            50% { height: 35px; transform: scaleX(1.05); }
        }

        /* LISTENING State */
        body.listening .screen {
            background: #c1f9cf;
            box-shadow: inset 0 0 50px rgba(255,255,255,0.5);
        }
        body.listening .eye {
            width: 45px;
            height: 45px;
            animation: none;
        }
        body.listening .mouth {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 6px solid #0a1d20;
            animation: pulse 0.8s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* PROCESSING State */
        body.processing .eye {
            width: 40px;
            height: 10px;
            border-radius: 5px;
            animation: thinking 1.5s infinite alternate ease-in-out;
        }
        @keyframes thinking {
            0% { transform: translateX(-15px); }
            100% { transform: translateX(15px); }
        }
        body.processing .mouth {
            width: 50px;
            height: 0;
            border-bottom: 6px solid #0a1d20;
            border-radius: 0;
            animation: none;
        }

    </style>
</head>
<body class="sleeping">

<div class="screen">
    <div class="eyes">
        <div class="eye"></div>
        <div class="eye" style="animation-delay: 0.1s;"></div>
    </div>
    <div class="mouth"></div>
</div>

<script>
    function setVoiceState(state) {
        document.body.className = state.toLowerCase();
    }
</script>

</body>
</html>
