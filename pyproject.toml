[project]
name = "bingo"
version = "0.1.0"
description = "Personal desktop assistant for Linux"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "playwright>=1.64.0",
    "pychromecast>=14.0.10",
    "rapidfuzz>=3.14.5",
    "websockets>=16.1",
]

[project.scripts]
bingo-server = "bingo.main:main"
bingo-music = "bingo.actions.music:cli_main"

[tool.uv]
package = true
